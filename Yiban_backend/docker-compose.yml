version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: etsaion-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "etsaion"
      TZ: "Asia/Shanghai"
    volumes:
      - etsaion-mysql-data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - etsaion-network
    restart: always

  redis:
    image: redis:7.0-alpine
    container_name: etsaion-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - etsaion-redis-data:/data
    networks:
      - etsaion-network
    restart: always

volumes:
  etsaion-mysql-data:
  etsaion-redis-data:

networks:
  etsaion-network:
    driver: bridge
