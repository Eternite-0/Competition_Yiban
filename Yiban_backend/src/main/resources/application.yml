server:
  port: 8080

spring:
  application:
    name: etsaion-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/etsaion?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # 空库从 V1 自动建起；非空旧库必须先显式执行 db/adopt-flyway.sql。
    # 禁止自动 baseline，避免把结构不完整的旧库静默标记为最新版本。
    baseline-on-migrate: false
    # 已执行的脚本被改动时拒绝启动，而不是让各人的库悄悄分叉。
    # 若报 checksum mismatch，说明有人改了已发布的迁移——
    # 正确做法是回滚那次改动并新增一个版本，实在要接受则跑 mvn flyway:repair。
    validate-on-migrate: true
    # 禁掉 flyway:clean，避免误执行清空整个库
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    # Use SLF4J for MyBatis logging so it flows through Logback (structured JSON in prod)
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

logging:
  level:
    com.etsaion: INFO

jwt:
  # Secret key for HS256 algorithm (must be at least 256 bits, i.e., 32 characters/bytes)
  # IMPORTANT: Must be set via JWT_SECRET environment variable in production!
  secret: ${JWT_SECRET:ZXRzYWlvbjIwMjRKd3RTZWNyZXRLZXkyNTZCaXRzU2VjdXJlISE=}
  expire: ${JWT_EXPIRE:86400000} # 24 hours in milliseconds

file:
  upload-path: ./uploads # relative path to current directory

ai:
  base-url: ${AI_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:mimo-v2.5-pro}
  vision-model: ${AI_VISION_MODEL:mimo-v2-omni}
  context-window: ${AI_CONTEXT_WINDOW:1000000}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:25}
  max-retries: ${AI_MAX_RETRIES:0}

oss:
  qiniu:
    access-key: ${QINIU_ACCESS_KEY:}
    secret-key: ${QINIU_SECRET_KEY:}
    bucket: ${QINIU_BUCKET:}
    domain: ${QINIU_DOMAIN:${QINIU_FILE_BASE_URL:}}
    upload-url: ${QINIU_UPLOAD_URL:https://up-z2.qiniup.com}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: alpha

