name: etsaion

services:
  mysql:
    image: mysql:8.0
    container_name: etsaion-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-etsaion2024}"
      MYSQL_DATABASE: "etsaion"
      TZ: "Asia/Shanghai"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./Yiban_backend/db:/docker-entrypoint-initdb.d
    networks:
      - etsaion-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: etsaion-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - etsaion-network
    restart: unless-stopped

  backend:
    build:
      context: ./Yiban_backend
      dockerfile: Dockerfile
    container_name: etsaion-backend
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/etsaion?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_ROOT_PASSWORD:-etsaion2024}"
      SPRING_DATA_REDIS_HOST: "redis"
      JWT_SECRET: "${JWT_SECRET:-etsaion2024JwtSecretKey256BitsSecure!!}"
      QINIU_ACCESS_KEY: "5mVX0PjPeiyN1PCjQzX_uoO2_9pJSFlX6RprpnkG"
      QINIU_SECRET_KEY: "48HRqX-6186oOsaPeGqxtbd5KTB0SU9Ib0opYkXm"
      QINIU_BUCKET: "competive123"
      QINIU_DOMAIN: "http://tfnb602dp.hn-bkt.clouddn.com"
      QINIU_UPLOAD_URL: "https://up-z2.qiniup.com"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - etsaion-network
    restart: unless-stopped

  frontend:
    build:
      context: ./Yiban
      dockerfile: Dockerfile
    container_name: etsaion-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - etsaion-network
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:

networks:
  etsaion-network:
    driver: bridge